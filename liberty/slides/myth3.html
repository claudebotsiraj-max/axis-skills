<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/ball-routine.jpg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.60); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.truth-tag { background: rgba(134,239,172,0.25); border: 1px solid rgba(134,239,172,0.5); border-radius: 50px; padding: 16px 44px; margin-bottom: 50px; }
.truth-tag span { color: #86efac; font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
h1 { font-size: 78px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 50px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.skills { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 50px; }
.skill { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; padding: 18px 36px; }
.skill span { color: #fff; font-size: 32px; font-weight: 600; }
p { font-size: 40px; color: rgba(255,255,255,0.85); line-height: 1.6; max-width: 850px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); font-style: italic; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">3/5</div>
  <div class="content">
    <div class="truth-tag"><span>The Truth</span></div>
    <h1>We start with<br>coordination,<br>not contortion.</h1>
    <div class="skills">
      <div class="skill"><span>⚖️ Balance</span></div>
      <div class="skill"><span>🎵 Rhythm</span></div>
      <div class="skill"><span>👂 Listening</span></div>
      <div class="skill"><span>💪 Confidence</span></div>
    </div>
    <p>Flexibility comes naturally as they train — not as a prerequisite.</p>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
