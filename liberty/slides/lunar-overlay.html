<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .container {
    width: 1080px; height: 1920px;
    display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
    padding: 60px 40px;
    background: transparent;
  }
  .top-text {
    text-align: center;
    padding: 30px 50px;
    background: linear-gradient(135deg, rgba(204,0,0,0.85), rgba(139,0,0,0.85));
    border-radius: 20px;
    border: 3px solid #FFD700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .top-text h1 {
    font-family: 'Georgia', serif;
    font-size: 64px;
    color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 10px;
  }
  .top-text h2 {
    font-family: 'Georgia', serif;
    font-size: 44px;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  .lanterns {
    font-size: 80px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .bottom-text {
    text-align: center;
    padding: 25px 50px;
    background: linear-gradient(135deg, rgba(204,0,0,0.85), rgba(139,0,0,0.85));
    border-radius: 20px;
    border: 3px solid #FFD700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .bottom-text p {
    font-family: 'Georgia', serif;
    font-size: 36px;
    color: white;
    line-height: 1.4;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }
  .bottom-text .heart { color: #FFD700; }
  .logo {
    font-family: 'Georgia', serif;
    font-size: 28px;
    color: #FFD700;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <div>
    <div class="lanterns">🏮🧧🐍🧧🏮</div>
    <div class="top-text" style="margin-top: 20px;">
      <h1>Happy Lunar New Year!</h1>
      <h2>Year of the Snake 2025 🐍</h2>
    </div>
  </div>
  <div class="bottom-text">
    <p>From our Liberty Academy family<br>to yours <span class="heart">❤️</span></p>
    <p class="logo">✨ Liberty Academy of Rhythmic Gymnastics ✨</p>
  </div>
</div>
</body>
</html>
