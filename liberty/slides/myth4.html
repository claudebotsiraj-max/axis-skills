<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/team-group.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(45,27,78,0.65); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.proof-tag { background: rgba(251,191,36,0.25); border: 1px solid rgba(251,191,36,0.5); border-radius: 50px; padding: 16px 44px; margin-bottom: 50px; }
.proof-tag span { color: #fbbf24; font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
h1 { font-size: 76px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 50px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #fbbf24; }
p { font-size: 40px; color: rgba(255,255,255,0.9); line-height: 1.6; max-width: 850px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.stat-bar { margin-top: 40px; background: rgba(251,191,36,0.2); border: 2px solid rgba(251,191,36,0.4); border-radius: 20px; padding: 30px 50px; }
.stat-text { color: #fbbf24; font-size: 34px; font-weight: 700; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">4/5</div>
  <div class="content">
    <div class="proof-tag"><span>The Proof</span></div>
    <h1>Our Olympian<br>started just like<br><span class="highlight">your daughter.</span></h1>
    <p>They didn't walk in doing the splits. They walked in curious.</p>
    <div class="stat-bar"><div class="stat-text">🏆 Only NJ club to produce Olympians · 33+ years</div></div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
