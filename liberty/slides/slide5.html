<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide {
  width: 1080px; height: 1920px;
  background: url('photos/training-session.jpeg') center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 80px; position: relative;
}
.overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(26,26,46,0.88) 0%, rgba(45,45,90,0.78) 50%, rgba(74,58,122,0.72) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 82px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.sub { font-size: 54px; color: #c4b5fd; margin-bottom: 60px; }
.features { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 850px; }
.feature { display: flex; align-items: center; gap: 30px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 36px 40px; text-align: left; }
.feat-emoji { font-size: 56px; flex-shrink: 0; }
.feat-text { font-size: 36px; color: rgba(255,255,255,0.95); font-weight: 500; line-height: 1.4; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <h1>Parents Love<br>It Too</h1>
    <div class="sub">❤️</div>
    <div class="features">
      <div class="feature"><div class="feat-emoji">👀</div><div class="feat-text">Comfortable viewing areas — never miss a moment</div></div>
      <div class="feature"><div class="feat-emoji">👨‍👩‍👧</div><div class="feat-text">A supportive community where families grow together</div></div>
      <div class="feature"><div class="feat-emoji">📱</div><div class="feat-text">Easy communication with coaches and staff</div></div>
      <div class="feature"><div class="feat-emoji">🌟</div><div class="feat-text">Watch your child's confidence bloom week by week</div></div>
    </div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
