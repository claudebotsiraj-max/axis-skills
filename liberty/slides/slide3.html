<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide {
  width: 1080px; height: 1920px;
  background: url('photos/young-gymnast.jpeg') center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 80px; position: relative;
}
.overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(26,51,32,0.88) 0%, rgba(45,90,53,0.78) 50%, rgba(61,122,69,0.72) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 88px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.sub { font-size: 68px; color: #86efac; font-weight: 800; margin-bottom: 60px; }
.divider { width: 120px; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; margin-bottom: 60px; }
p { font-size: 44px; color: rgba(255,255,255,0.9); line-height: 1.6; max-width: 850px; margin-bottom: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.quote-box { margin-top: 40px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-left: 6px solid #86efac; border-radius: 0 20px 20px 0; padding: 40px 50px; max-width: 850px; }
.quote { font-size: 38px; color: #86efac; font-style: italic; font-weight: 600; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <h1>Zero Experience?</h1>
    <div class="sub">Perfect. 👌</div>
    <div class="divider"></div>
    <p>Our beginner program (ages 3–6) is designed for kids who've never set foot in a gym.</p>
    <p>No prerequisites. No pressure. Just fun.</p>
    <div class="quote-box"><div class="quote">"Every champion started exactly here."</div></div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
