<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 70px;text-align:center;color:#fff}
.slide-num{position:absolute;top:40px;right:50px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.38)}
.gold{color:#D4A853}
h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:68px;line-height:1.1;margin-bottom:50px;text-transform:uppercase}
.price-card{background:rgba(0,0,0,0.4);border:3px solid #D4A853;border-radius:30px;padding:50px 60px;margin-bottom:30px;width:100%;max-width:860px}
.price-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;font-size:34px;font-weight:600}
.price-item:last-child{margin-bottom:0}
.price-val{color:#D4A853;font-family:'Montserrat',sans-serif;font-weight:800;font-size:36px}
.free-badge{background:#D4A853;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:36px;padding:18px 50px;border-radius:50px;margin-top:20px;display:inline-block}
.note{font-size:28px;opacity:0.7;margin-top:25px}
.pill{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:#D4A853;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;padding:16px 50px;border-radius:50px;letter-spacing:3px}
</style></head><body>
<img class="bg" src="file:///Users/sms/.openclaw/workspace/liberty/slides/photos/pov1.jpg">
<div class="overlay"></div>
<div class="slide-num">5/6</div>
<div class="content">
<h1>Early Bird<br><span class="gold">Pricing</span></h1>
<div class="price-card">
<div class="price-item"><span>📅 Weekly Sessions</span></div>
<div class="price-item"><span>🌤️ Half Day</span><span class="price-val">Available</span></div>
<div class="price-item"><span>☀️ Full Day</span><span class="price-val">Available</span></div>
<div class="price-item"><span>🎉 Early Bird Discount</span><span class="price-val">SAVE!</span></div>
</div>
<div class="free-badge">✨ FREE TRIAL CLASS</div>
<div class="note">Limited spots — register early</div>
</div>
<div class="pill">LIBERTY ACADEMY</div>
</body></html>
