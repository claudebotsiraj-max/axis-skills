<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 70px;text-align:center;color:#fff}
.slide-num{position:absolute;top:40px;right:50px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.38)}
.gold{color:#D4A853}
h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:68px;line-height:1.1;margin-bottom:40px;text-transform:uppercase}
p{font-size:38px;line-height:1.6;font-weight:500;opacity:0.9}
.divider{width:120px;height:5px;background:#D4A853;margin:35px auto}
.stat-row{display:flex;gap:60px;margin-top:40px}
.stat{text-align:center}
.stat-num{font-family:'Montserrat',sans-serif;font-weight:900;font-size:64px;color:#D4A853}
.stat-label{font-size:26px;opacity:0.8;margin-top:5px}
.pill{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:#D4A853;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;padding:16px 50px;border-radius:50px;letter-spacing:3px}
</style></head><body>

<div class="stat-row">
<div class="stat"><div class="stat-num">33+</div><div class="stat-label">Years</div></div>
<div class="stat"><div class="stat-num">🏅</div><div class="stat-label">Olympians<br>Produced</div></div>
</div>
</div>

</body></html>
