<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/group-pose.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.70); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 90px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 40px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #86efac; }
p { font-size: 42px; color: rgba(255,255,255,0.9); line-height: 1.6; max-width: 850px; margin-bottom: 20px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.cta-btn { margin-top: 40px; background: #fff; color: #1a1a2e; font-size: 42px; font-weight: 800; padding: 32px 70px; border-radius: 60px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.details { margin-top: 40px; font-size: 32px; color: rgba(255,255,255,0.7); }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">5/5</div>
  <div class="content">
    <h1>Her first class<br>is <span class="highlight">free.</span></h1>
    <p>Ages 3+. No experience needed.</p>
    <p>Book a free trial and see her light up. 💜</p>
    <div class="cta-btn">DM us "TRIAL"</div>
    <div class="details">librhythm.com · East Hanover, NJ</div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
