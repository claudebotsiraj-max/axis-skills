<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/ball-routine.jpg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(45,27,78,0.65); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 78px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 50px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.skills { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 850px; }
.skill-row { display: flex; align-items: center; gap: 24px; background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 28px 36px; text-align: left; }
.skill-icon { font-size: 40px; flex-shrink: 0; }
.skill-text { font-size: 34px; color: rgba(255,255,255,0.95); font-weight: 500; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">3/6</div>
  <div class="content">
    <h1>What They'll<br>Learn</h1>
    <div class="skills">
      <div class="skill-row"><div class="skill-icon">🎀</div><div class="skill-text">Ribbon, hoop, ball, clubs & rope</div></div>
      <div class="skill-row"><div class="skill-icon">💪</div><div class="skill-text">Flexibility & strength training</div></div>
      <div class="skill-row"><div class="skill-icon">💃</div><div class="skill-text">Dance & performance skills</div></div>
      <div class="skill-row"><div class="skill-icon">⭐</div><div class="skill-text">Confidence that lasts way beyond summer</div></div>
    </div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
