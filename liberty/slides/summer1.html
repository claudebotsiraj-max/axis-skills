<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/hoop-routine.jpg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.65); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.campaign-tag { background: linear-gradient(135deg, #D4AF37, #B8860B); border-radius: 50px; padding: 18px 50px; margin-bottom: 50px; }
.campaign-tag span { color: #fff; font-size: 26px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
h1 { font-size: 92px; color: #fff; font-weight: 800; line-height: 1.1; margin-bottom: 30px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #D4AF37; }
.year { font-size: 120px; color: #D4AF37; font-weight: 800; margin-bottom: 40px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
p { font-size: 48px; color: rgba(255,255,255,0.9); line-height: 1.5; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">1/6</div>
  <div class="content">
    <div class="campaign-tag"><span>🏅 Now Open</span></div>
    <h1>SUMMER OF<br><span class="highlight">CHAMPIONS</span></h1>
    <div class="year">2026</div>
    <p>Registration is officially open.</p>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
