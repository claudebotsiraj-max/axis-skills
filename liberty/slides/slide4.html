<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide {
  width: 1080px; height: 1920px;
  background: url('photos/medal-ceremony.jpeg') center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 80px; position: relative;
}
.overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(42,26,10,0.9) 0%, rgba(90,58,26,0.8) 50%, rgba(138,90,42,0.72) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 80px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 50px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #fbbf24; }
.coach-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; padding: 50px; max-width: 900px; text-align: left; }
.coach-name { font-size: 48px; color: #fbbf24; font-weight: 800; margin-bottom: 10px; }
.coach-title { font-size: 32px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
.stat-row { display: flex; gap: 20px; margin-bottom: 20px; }
.stat { flex: 1; background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3); border-radius: 20px; padding: 28px 20px; text-align: center; }
.stat-num { font-size: 52px; color: #fbbf24; font-weight: 800; }
.stat-label { font-size: 24px; color: rgba(255,255,255,0.8); margin-top: 6px; }
.seal { margin-top: 40px; background: rgba(251,191,36,0.2); border: 2px solid rgba(251,191,36,0.5); border-radius: 16px; padding: 24px 40px; text-align: center; }
.seal-text { font-size: 30px; color: #fbbf24; font-weight: 700; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <h1>Trained by the<br><span class="highlight">Best in NJ</span></h1>
    <div class="coach-card">
      <div class="coach-name">Coach Nataliya Greenberg</div>
      <div class="coach-title">Owner & Head Coach</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-num">33+</div><div class="stat-label">Years Coaching</div></div>
        <div class="stat"><div class="stat-num">🏅</div><div class="stat-label">Olympians Produced</div></div>
        <div class="stat"><div class="stat-num">2006</div><div class="stat-label">Founded</div></div>
      </div>
      <div class="seal"><div class="seal-text">🏆 Only NJ Club to Produce Olympians</div></div>
    </div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
