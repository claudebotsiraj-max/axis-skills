<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/pov5-results.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,5,51,0.5) 0%, rgba(45,27,105,0.8) 60%, rgba(74,44,138,0.9) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin-top: 900px; }
h1 { font-size: 78px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 30px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #e8b4f8; }
p { font-size: 42px; color: rgba(255,255,255,0.9); line-height: 1.5; max-width: 850px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <h1>🏆 They Call <span class="highlight">Her Name</span></h1>
    <p>She steps onto the podium. Crown on her head. Sash across her chest. You're not crying. (You are.)</p>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
