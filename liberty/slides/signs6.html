<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/signs6-cta.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(26,5,51,0.85) 0%, rgba(45,27,105,0.75) 50%, rgba(74,44,138,0.7) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.emoji-big { font-size: 140px; margin-bottom: 40px; }
h1 { font-size: 80px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 40px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.highlight { color: #e8b4f8; }
p { font-size: 44px; color: rgba(255,255,255,0.9); line-height: 1.5; max-width: 850px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.cta { margin-top: 50px; background: linear-gradient(135deg, #e8b4f8 0%, #c084fc 100%); color: #1a0533; font-size: 40px; font-weight: 800; padding: 30px 60px; border-radius: 60px; letter-spacing: 1px; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <div class="emoji-big">🌟</div>
    <h1>Sound Like <span class="highlight">Your Daughter?</span></h1>
    <p>Book a FREE trial class and watch her shine ✨</p>
    <div class="cta">📍 East Hanover, NJ</div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
