<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide {
  width: 1080px; height: 1920px;
  background: url('photos/performance.jpeg') center/cover no-repeat;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 80px; position: relative;
}
.overlay { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(74,14,46,0.88) 0%, rgba(138,26,74,0.78) 50%, rgba(196,42,106,0.7) 100%); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.emoji-top { font-size: 140px; margin-bottom: 40px; }
h1 { font-size: 90px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 50px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.cta-btn { background: #fff; color: #c42a6a; font-size: 46px; font-weight: 800; padding: 36px 80px; border-radius: 60px; margin-bottom: 50px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.divider { width: 120px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin-bottom: 50px; }
.info { font-size: 36px; color: rgba(255,255,255,0.9); line-height: 1.8; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.website { font-size: 50px; color: #fff; font-weight: 800; margin-top: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.location { margin-top: 40px; font-size: 30px; color: rgba(255,255,255,0.7); }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.95); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <div class="emoji-top">🤸‍♀️</div>
    <h1>Ready to<br>Start?</h1>
    <div class="cta-btn">Enroll Now</div>
    <div class="divider"></div>
    <div class="info">Beginner classes enrolling now<br>Ages 3–6 · East Hanover, NJ</div>
    <div class="website">librhythm.com</div>
    <div class="location">149 Ridgedale Avenue, East Hanover, NJ 07936</div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
