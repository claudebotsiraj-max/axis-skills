<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
.slide { width: 1080px; height: 1920px; background: url('photos/performance.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px; position: relative; }
.overlay { position: absolute; inset: 0; background: rgba(26,26,46,0.70); }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 76px; color: #fff; font-weight: 800; line-height: 1.15; margin-bottom: 30px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
p { font-size: 42px; color: rgba(255,255,255,0.85); line-height: 1.5; margin-bottom: 40px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.cta-btn { background: linear-gradient(135deg, #D4AF37, #B8860B); color: #fff; font-size: 44px; font-weight: 800; padding: 34px 74px; border-radius: 60px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); margin-bottom: 40px; }
.details { font-size: 34px; color: rgba(255,255,255,0.7); }
.website { font-size: 46px; color: #fff; font-weight: 700; margin-top: 20px; }
.badge { position: absolute; bottom: 80px; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 20px 50px; }
.badge span { color: rgba(255,255,255,0.9); font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
.slide-num { position: absolute; top: 60px; right: 70px; z-index: 1; font-size: 28px; color: rgba(255,255,255,0.5); font-weight: 600; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="slide-num">6/6</div>
  <div class="content">
    <h1>Don't Wait —<br>Spots Fill<br>Every Year</h1>
    <p>Secure her summer now.</p>
    <div class="cta-btn">DM us "SUMMER"</div>
    <div class="details">📍 East Hanover, NJ · Ages 3–12</div>
    <div class="website">librhythm.com</div>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
