<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; font-family:'Helvetica Neue',Arial,sans-serif; overflow:hidden; }
.slide { width:1080px; height:1920px; background:url('photos/new-group1.jpg') center/cover no-repeat; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:80px; position:relative; }
.overlay { position:absolute; inset:0; background:linear-gradient(160deg, rgba(26,26,46,0.38) 0%, rgba(45,27,78,0.38) 50%, rgba(74,25,66,0.38) 100%); }
.content { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
.emoji-big { font-size:150px; margin-bottom:40px; }
h1 { font-size:88px; color:#fff; font-weight:800; line-height:1.15; margin-bottom:40px; letter-spacing:-1px; text-shadow:0 4px 30px rgba(0,0,0,0.8), 0 2px 10px rgba(0,0,0,0.9); }
.gold { color:#D4AF37; }
.highlight { color:#e8b4f8; }
p { font-size:44px; color:rgba(255,255,255,0.38); line-height:1.5; max-width:850px; text-shadow:0 3px 20px rgba(0,0,0,0.8), 0 1px 6px rgba(0,0,0,0.9); }
.badge { position:absolute; bottom:80px; z-index:1; background:rgba(255,255,255,0.15); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.25); border-radius:50px; padding:20px 50px; }
.badge span { color:rgba(255,255,255,0.38); font-size:30px; letter-spacing:3px; text-transform:uppercase; }
</style></head><body>
<div class="slide">
  <div class="overlay"></div>
  <div class="content">
    <h1>Skills That<br><span class='highlight'>Transfer</span><br>Everywhere</h1>
    <p>Flexibility, coordination, musicality, performance confidence.</p>
  </div>
  <div class="badge"><span>Liberty Academy</span></div>
</div>
</body></html>
